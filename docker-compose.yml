# 느링고 역할극 PoC — 로컬에서 통째로 띄우기
#
#   cp server/.env.example server/.env    # 키를 채운다
#   docker compose up --build
#   → 콘솔 http://localhost:8080
#
# 키는 이미지에 넣지 않는다. env_file 로 실행 시점에 주입하고, server/.env 는
# .gitignore·.dockerignore 양쪽에서 막혀 있다.

services:
  api:
    build:
      context: ./server
    # server/.env 가 없으면 여기서 바로 멈춘다. app/config.py 가 필수 세 값이
    # 비었을 때 무엇이 비었는지 말해 주므로, 조용히 이상하게 도는 일은 없다.
    env_file:
      - ./server/.env
    environment:
      # 컨테이너를 지워도 기록이 남게 볼륨 위에 둔다.
      ET_DB_PATH: /data/neuringo_poc.db
    volumes:
      - roleplay-db:/data
    # 8000 을 호스트로 내보내지 않는다 — 콘솔이 같은 오리진으로 /api 를 프록시하므로
    # 필요 없고, 아동 발화를 다루는 API 를 굳이 밖에 열 이유가 없다.
    # 직접 두들겨 볼 일이 있으면 아래 주석을 풀어라.
    # ports:
    #   - "8000:8000"
    expose:
      - "8000"
    restart: unless-stopped

  web:
    build:
      # 컨텍스트가 루트다 — 파이프라인 페이지가 server/ 의 파이썬 소스를 싣는다.
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  # 아동 발화가 쌓이는 곳이다. 지우면 되돌릴 수 없다:
  #   docker compose down -v
  roleplay-db:
