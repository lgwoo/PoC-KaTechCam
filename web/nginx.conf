# 정적 파일을 내주고 /api 는 API 컨테이너로 넘긴다.
#
# 같은 오리진으로 묶는 게 핵심이다. 브라우저가 /api 를 이 서버로 부르므로
# CORS 가 아예 생기지 않는다 — app/main.py 의 allow_origins 는 Vite 개발 서버
# (localhost:5173) 만 열어 두고 있어서, 다른 오리진으로 붙이면 막힌다.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # 프론트는 단일 페이지다. 새로고침해도 index.html 로 떨어져야 한다.
    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 한 턴이 30초를 넘는다(실측 p95 24초, 최대 36초). 기본 60초로는
        # 재생성이 걸린 턴에서 504 가 난다.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /health {
        proxy_pass http://api:8000/health;
    }
}
